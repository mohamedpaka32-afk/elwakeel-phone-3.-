<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوكيل فون - Elwakeel Phone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #1a237e;
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-align: center;
            padding: 15px;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img {
            width: 100%;
            height: 200px;
            background-color: #eaeaea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .product-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #1a237e;
        }
        .product-price {
            color: #e65100;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .btn-add {
            background-color: #1a237e;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-add:hover {
            background-color: #283593;
        }
        .cart-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .cart-title {
            color: #1a237e;
            margin-bottom: 15px;
            border-bottom: 2px solid #f4f6f9;
            padding-bottom: 10px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f4f6f9;
        }
        .cart-total {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            color: #1a237e;
        }
        .btn-checkout {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .btn-checkout:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <header>
        <h1>الوكيل فون - Elwakeel Phone</h1>
        <p>أحدث الهواتف الذكية بأفضل الأسعار</p>
    </header>

    <div class="container">
        <!-- قسم المنتجات -->
        <div class="products-grid">
            <!-- هاتف 1 -->
            <div class="product-card">
                <div class="product-img">صورة الهاتف 1</div>
                <h3 class="product-title">آيفون 15 برو</h3>
                <p class="product-price">55,000 ج.م</p>
                <button class="btn-add" onclick="addToCart('آيفون 15 برو', 55000)">إضافة للسلة</button>
            </div>

            <!-- هاتف 2 -->
            <div class="product-card">
                <div class="product-img">صورة الهاتف 2</div>
                <h3 class="product-title">سامسونج S24 أولترا</h3>
                <p class="product-price">52,000 ج.م</p>
                <button class="btn-add" onclick="addToCart('سامسونج S24 أولترا', 52000)">إضافة للسلة</button>
            </div>

            <!-- هاتف 3 -->
            <div class="product-card">
                <div class="product-img">صورة الهاتف 3</div>
                <h3 class="product-title">شاومي 14 برو</h3>
                <p class="product-price">35,000 ج.م</p>
                <button class="btn-add" onclick="addToCart('شاومي 14 برو', 35000)">إضافة للسلة</button>
            </div>
        </div>

        <!-- قسم سلة المشتريات -->
        <div class="cart-section">
            <h2 class="cart-title">سلة المشتريات</h2>
            <div id="cart-items">
                <p style="color: #888;">السلة فارغة حالياً.</p>
            </div>
            <div class="cart-total">الإجمالي: <span id="total-price">0</span> ج.م</div>
            <button class="btn-checkout" onclick="checkoutWhatsApp()">إرسال الطلب عبر الواتساب</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name, price });
            total += price;
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceContainer = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #888;">السلة فارغة حالياً.</p>';
            } else {
                cartItemsContainer.innerHTML = '';
                cart.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `<span>${item.name}</span><span>${item.price.toLocaleString()} ج.م</span>`;
                    cartItemsContainer.appendChild(itemElement);
                });
            }
            totalPriceContainer.innerText = total.toLocaleString();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) {
                alert('برجاء إضافة منتجات للسلة أولاً!');
                return;
            }
            
            let message = 'مرحباً الوكيل فون، أريد طلب المنتجات التالية:\n';
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price.toLocaleString()} ج.م\n`;
            });
            message += `\nالإجمالي: ${total.toLocaleString()} ج.م`;
            
            // استبدل الرقم بالرقم الخاص بمتجرك مع كود الدولة (مثال: 201000000000)
            const whatsappNumber = "201000000000"; 
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me{whatsappNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
